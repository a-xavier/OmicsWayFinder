odc_version: "0.1"
id: "odc:fastq-end-trimming"
description: >
  Illustrative fixed-length trimming of a single FASTQ file at the 5' and
  3' ends when the corresponding terminal N-base mean quality is below Q25.

input_format:
  reads:
    id: "http://edamontology.org/format_1930"
    label: "FASTQ"

action:
  id: "http://edamontology.org/operation_3192"
  label: "Sequence trimming"

software:
  name: "fastp"
  url: "https://github.com/OpenGene/fastp"

output_format:
  id: "http://edamontology.org/format_1930"
  label: "FASTQ"

thresholds:
  quality_phred: 25
  terminal_bases: 5

sources:
  stats:
    mean_quality_first_n:
      provider: "FastQC"
      output: "Per base sequence quality / Mean"
      calculation: "Mean of the first thresholds.terminal_bases cycle means."
      scope: "All input reads; fixed read length and ungrouped cycles required."
      unit: "Phred"
    mean_quality_last_n:
      provider: "FastQC"
      output: "Per base sequence quality / Mean"
      calculation: "Mean of the last thresholds.terminal_bases cycle means."
      scope: "All input reads; fixed read length and ungrouped cycles required."
      unit: "Phred"
  thresholds:
    quality_phred:
      kind: "draft_choice"
      explanation: "Q25 is an illustrative contract-author choice, not a FastQC recommendation."
    terminal_bases:
      kind: "draft_choice"
      explanation: "N = 5 is an illustrative contract-author choice, not inferred from the report."

arguments:
  --trim_front1: 0
  --trim_tail1: 0
  --disable_adapter_trimming: true
  --disable_trim_poly_g: true
  --disable_quality_filtering: true
  --disable_length_filtering: true

rules:
  - when: "stats.mean_quality_first_n < thresholds.quality_phred"
    arguments:
      --trim_front1: "${thresholds.terminal_bases}"
    explanation: >
      The mean Phred quality over the first N bases across reads is below
      Q25, so remove exactly N bases from the 5' end of every read.

  - when: "stats.mean_quality_last_n < thresholds.quality_phred"
    arguments:
      --trim_tail1: "${thresholds.terminal_bases}"
    explanation: >
      The mean Phred quality over the last N bases across reads is below
      Q25, so remove exactly N bases from the 3' end of every read.